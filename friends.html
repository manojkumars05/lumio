<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js">
  <link rel="modulepreload" href="js/firebase-config.js">
  <title>Friends - InfiniX</title>
  <meta name="theme-color" content="#0f0b1f">
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-ptr="photos">
  <header class="ix-top">
    <a class="brand" href="home.html"><img src="assets/images/logo.svg" alt="" width="32" height="32"><span>InfiniX</span></a>
    <span class="avatar" data-user-avatar aria-hidden="true">?</span>
  </header>
  <main id="main" class="container ix-page">
    <h1 class="ix-title">Friends</h1>
    <div class="ix-counts">
      <button type="button" class="ix-count" data-tab="followers"><strong id="cFollowers">0</strong><span>Followers</span></button>
      <button type="button" class="ix-count" data-tab="following"><strong id="cFollowing">0</strong><span>Following</span></button>
    </div>
    <div class="ix-tabs" role="tablist">
      <button class="ix-tab" role="tab" data-tab="friends" aria-selected="true">Friends</button>
      <button class="ix-tab" role="tab" data-tab="followers" aria-selected="false">Followers</button>
      <button class="ix-tab" role="tab" data-tab="following" aria-selected="false">Following</button>
    </div>
    <div id="list" class="ix-list" aria-live="polite"></div>
    <p class="muted" id="empty" hidden></p>
  </main>

  <script src="js/boot.js"></script>
  <script type="module" src="js/friends.js"></script>
  <script type="module" src="js/sidebar.js"></script>
  <script src="js/ptr.js"></script>
</body>
</html>
