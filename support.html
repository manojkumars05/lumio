<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js">
  <link rel="modulepreload" href="js/firebase-config.js">
  <title>Contact support - Lumio</title>
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .ticket { border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px; margin-top:12px; background:var(--surface-2); }
    .ticket h3 { margin:0 0 4px; font-size:1rem; }
    .ticket .meta { color:var(--muted); font-size:.8rem; margin-bottom:8px; }
    .ticket .body { white-space:pre-wrap; word-wrap:break-word; }
    .ticket .reply { margin-top:10px; padding:10px 12px; border-left:3px solid var(--primary); background:var(--surface); border-radius:6px; white-space:pre-wrap; }
    .tag { display:inline-block; font-size:.72rem; padding:2px 8px; border-radius:999px; margin-left:6px; }
    .tag.open { background:var(--warn-bg); color:var(--warn); }
    .tag.answered { background:var(--success-bg); color:var(--success); }
    .ticket form { margin-top:10px; }
    .ticket textarea { min-height:70px; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="home.html"><img src="assets/images/logo.svg" alt="" width="34" height="34"><span>Lumio</span></a>
    <div class="header-right">
      <nav class="nav" aria-label="Primary">
        <a href="home.html">Home</a>
        <a href="upload.html">Upload</a>
        <a href="chat.html">Chat</a>
        <a href="settings.html">Settings</a>
        <a href="support.html" aria-current="page">Support</a>
      </nav>
      <div class="user-chip">
        <span class="avatar" data-user-avatar aria-hidden="true">?</span>
        <span class="user-text"><strong data-user-name>Loading...</strong><small data-user-email></small></span>
      </div>
      <button class="btn btn-ghost btn-sm" type="button" data-logout aria-label="Log out"><span class="btn-logout-text">Log out</span></button>
    </div>
  </header>

  <main id="main" class="container" style="max-width:640px;padding:32px 0;">
    <h1 style="margin-bottom:20px;">Contact support</h1>

    <section class="auth-card" style="margin-bottom:24px;">
      <h2 style="margin-bottom:6px;">Send us a message</h2>
      <p class="lead" style="margin-bottom:14px;">Problem, question or feedback? Write it here and the admin will reply on this page.</p>
      <div id="formMsg" class="alert" hidden></div>
      <form id="supportForm" novalidate>
        <div class="field">
          <label for="subject">Subject</label>
          <input id="subject" type="text" maxlength="100" placeholder="Short title" required>
          <div class="field-error" id="subject-error" aria-live="polite"></div>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" maxlength="2000" placeholder="Tell us what happened" required></textarea>
          <div class="field-error" id="message-error" aria-live="polite"></div>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="sendBtn">
          <span class="spinner" hidden></span><span class="btn-label">Send</span>
        </button>
      </form>
    </section>

    <section class="auth-card" style="margin-bottom:24px;">
      <h2 style="margin-bottom:6px;">Your messages</h2>
      <div id="mine"><p class="lead">Loading...</p></div>
    </section>

    <section class="auth-card" id="adminBox" hidden>
      <h2 style="margin-bottom:6px;">Admin: all support messages</h2>
      <div id="all"><p class="lead">Loading...</p></div>
    </section>
  </main>

  <script src="js/boot.js"></script>
  <script type="module" src="js/support.js"></script>
  <script type="module" src="js/sidebar.js"></script>
</body>
</html>
